version: 1
frontend:
  phases:
    build:
      commands:
        - node -e "const fs=require('fs'); fs.mkdirSync('dist', {recursive:true}); fs.copyFileSync('index.html', 'dist/index.html');" || (mkdir -p dist && cp index.html dist/index.html)
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths: []
