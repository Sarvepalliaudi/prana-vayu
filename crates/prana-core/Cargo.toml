[package]
name = "prana-core"
version = "0.1.0"
edition = "2021"
authors = ["SARVEPALLI AUDI SIVA BHANUVARDHAN <sarvepalliaudi@gmail.com>"]
description = "High-assurance domain model and validation engine for PRANA-VAYU environmental incident response platform"
license = "Apache-2.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

[dev-dependencies]
serde_json = "1.0"

[[bin]]
name = "prana-core"
path = "src/main.rs"
